name: employee-management-system
services:
  postgres:
    container_name: postgres-ems
    image: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ems
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - employee-management-network
    restart: unless-stopped

networks:
  employee-management-network:
    driver: bridge

volumes:
  postgres:
    driver: local
